name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 -r requirements-dev.txt

    - name: Install your package
      run: pip install -e .

    - name: Lint with flake8
      run: |
        # Check for syntax errors and undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Full linting (warnings only)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests with pytest
      run: |
        python -m pytest --cov=graphfla --cov-branch --cov-report=xml --cov-report=term

    - name: Smoke-test the EE benchmark only
      if: matrix.python-version == '3.13'
      run: python -m asv run --python=same --quick --dry-run -b '^analysis.ee\.' --show-stderr

    - name: Save coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-python-${{ matrix.python-version }}
        path: coverage.xml

  literature:
    name: Literature validation (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install package and test dependencies
      run: python -m pip install -r requirements-dev.txt -e .
    - name: Reproduce promoted literature cases
      env:
        OMP_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        PYTHONHASHSEED: "0"
      run: python -m validation.tests --junitxml=literature.xml --durations=10
    - name: Save cited test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: literature-results
        path: literature.xml
