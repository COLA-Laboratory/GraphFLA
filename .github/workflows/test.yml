name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 -r requirements-dev.txt

    - name: Install your package
      run: pip install -e .

    - name: Lint with flake8
      run: |
        # Check for syntax errors and undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Full linting (warnings only)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests with pytest
      run: |
        python -m pytest --cov=graphfla --cov-branch --cov-report=xml --cov-report=term

    - name: Check benchmark discovery
      if: matrix.python-version == '3.13'
      run: python -m asv check --python=same

    - name: Save coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-python-${{ matrix.python-version }}
        path: coverage.xml
