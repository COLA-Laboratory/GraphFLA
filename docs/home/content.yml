insights:
  eyebrow: Why landscape topography matters
  title: Landscape features help interpret model performance and optimization outcomes.
  intro: Landscape features help explain why predictive models and search algorithms perform differently across
    problems. They reveal interactions that complicate prediction, local optima that can trap search, and broad
    trends that can guide optimization.
  feature_label: Landscape feature
  publication_label: Read the study
  legend: Linear fit
  hint: Each point is a deep mutational scanning (DMS) dataset. Hover over or select a point to see its source study.
  source_label: Read more in our NeurIPS 2025 (Spotlight) paper
  source_href: https://papers.neurips.cc/paper_files/paper/2025/hash/323fcf83a0f26c7c04eae0d91125d518-Abstract-Datasets_and_Benchmarks_Track.html
  charts:
    proteingym:
      title: Zero-shot prediction
      description: ProteinGym · Prediction performance across protein assays
      outcome_label: Model
      y_label: Spearman correlation
      accessible_description: Each point is a protein DMS dataset. Select a landscape feature and a zero-shot model
        to compare Spearman prediction performance. Use arrow keys to move between points and Enter to read the
        associated publication.
    evolution:
      title: Directed evolution
      description: 18 near-complete combinatorial DMS assays
      outcome_label: Search strategy
      y_label: Best fitness percentile
      accessible_description: Each point is a protein landscape. Select a feature and a search strategy to compare
        optimization outcomes within a shared evaluation cap. Use arrow keys to move between points and Enter to
        read the associated publication.
