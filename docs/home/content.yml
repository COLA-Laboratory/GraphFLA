hero:
  title: Understand the *fitness landscape* of your optimization problem.
  lede: A fitness landscape maps the candidates in a design space, such as protein variants or reaction conditions,
    to their measured performance. GraphFLA builds this landscape from your data and characterizes its topography,
    revealing what makes a problem easy or hard to model and to optimize. These insights help you develop better
    predictive models and search algorithms.
  action:
    label: Get started
    href: '#start'
  figure:
    name: hero
    alt: An illustrative fitness landscape with improving paths, one reaching the global optimum and two ending
      at local optima.
    labels:
      global_peak: Global optimum
      local_peak_east: Local optimum
      local_peak_west: Local optimum
      height_axis: fitness
      floor_axis: design space
    legend:
    - swatch: line
      tone: accent
      label: improving path to the global optimum
    - swatch: line
      tone: mark
      label: improving paths ending at local optima
  stats:
  - value: 20+
    label: measures of landscape structure
  - value: '7'
    label: landscape types for sequences, categorical, ordinal and mixed data
  - value: '8'
    label: model landscapes and benchmark problems
  - value: '12'
    label: step-by-step tutorials on published data
  - value: '179'
    label: curated datasets across diverse domains
    href: datasets
