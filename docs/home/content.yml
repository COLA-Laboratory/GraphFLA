hero:
  title: Reveal the *structure* of your optimization problem.
  lede: Turn data on discrete choices and their outcomes into a map of your optimization problem. Understand local
    optima, interactions between variables, and routes to better-performing designs.
  action:
    label: Get started
    href: '#start'
  figure:
    name: hero
    alt: An illustrative optimization landscape with curved improving paths, one reaching the best outcome and two
      ending at local optima.
    labels:
      global_peak: Best outcome
      local_peak_east: Local optimum
      local_peak_west: Local optimum
      height_axis: objective value
      floor_axis: design choices
    legend:
    - swatch: line
      tone: accent
      label: improving path to the best outcome
    - swatch: line
      tone: mark
      label: paths ending at local optima
  stats:
  - value: 20+
    label: metrics covering four aspects of landscape structure
  - value: '7'
    label: classes for categorical, ordinal, sequence and mixed data
  - value: '8'
    label: test-problem generators
  - value: '9'
    label: worked tutorials with code and data
  - value: '179'
    label: datasets and experimental collections across diverse domains
