metrics:
  eyebrow: What you can measure
  title: A holistic picture of your landscape, with 20+ features across four aspects.
  intro: Each feature is implemented from established studies in evolutionary biology and optimization. Together
    they let you explore your problem from complementary angles and understand it fully.
  cards:
  - title: Ruggedness
    question: Is the landscape smooth or rugged?
    text: A rugged landscape has many local peaks and abrupt changes in fitness between neighbors. Ruggedness makes
      it more likely that stepwise improvement stops short of the best candidate.
    functions:
    - local_optima_ratio
    - r_s_ratio
    - autocorrelation
    - gradient_intensity
    link:
      label: Explore ruggedness
      href: ruggedness
    figure:
      name: ruggedness
      alt: 'Two landscapes side by side: a smooth one with a single peak and a rugged one with many local peaks.'
      labels:
        smooth: 'smooth: one peak'
        rugged: 'rugged: many local peaks'
  - title: Interactions
    question: Do the variables act independently?
    text: Variables interact when the effect of changing one depends on the values of others, known as epistasis
      in biology. Interactions that reverse the direction of an effect can block improving paths and create multiple
      peaks.
    functions:
    - gamma
    - classify_epistasis
    - idiosyncratic_index
    - walsh_hadamard
    link:
      label: Explore interactions
      href: epistasis
    figure:
      name: epistasis
      alt: The same change increases fitness in one part of the landscape and decreases it in another.
      legend:
      - swatch: line
        tone: accent
        label: a change that increases fitness here
      - swatch: line
        tone: mark
        label: the same change decreases it there
  - title: Navigability
    question: Can local search find the global optimum?
    text: 'Navigability describes how easily a search that accepts only improvements reaches the global optimum:
      from how many starting points, in how many steps, and whether fitness rises steadily towards it.'
    functions:
    - global_optima_accessibility
    - mean_path_length_to_global_optimum
    - fdc
    link:
      label: Explore navigability
      href: navigability
    figure:
      name: navigability
      alt: 'Improving paths on a landscape with three peaks: two reach the global optimum, three stop at local optima.'
      legend:
      - swatch: line
        tone: accent
        label: reaches the global optimum
      - swatch: line
        tone: mark
        label: stops at a local optimum
  - title: Neutrality
    question: How much of the landscape is flat?
    text: Neutral changes leave fitness essentially unchanged. Large flat regions can stall a search, but they also
      connect distant candidates of equal quality.
    functions:
    - neutrality
    - evolvability_enhancing_fraction
    link:
      label: Explore neutrality
      href: neutrality
    figure:
      name: neutrality
      alt: Candidates on a plateau share the same fitness and form a neutral network; one further step leaves the
        plateau for a higher peak.
      legend:
      - swatch: dots
        tone: mark
        label: neutral neighbors
      - swatch: line
        tone: accent
        label: a step to higher fitness
start:
  eyebrow: Quick start
  title: From raw data to landscape analysis in a few lines.
  lede: Simply load your dataset, specify the variables and the objective, and build the landscape. The same steps
    apply to laboratory measurements, simulations and model evaluations.
  links:
  - label: Try a worked tutorial
    href: tutorials
    accent: true
  - label: Read the API reference
    href: api
  code:
    language: Python
    examples:
    - id: protein
      label: Protein
      filename: quickstart.py
      source: 'import pandas as pd

        from graphfla import analysis

        from graphfla.landscape import ProteinLandscape


        df = pd.read_csv("variants.csv")

        X = df["sequence"]  # Amino-acid sequence of each variant

        f = df["activity"]  # Measured activity, to maximize


        landscape = ProteinLandscape(maximize=True)

        landscape.build_from_data(X, f)

        analysis.profile(landscape, seed=42)

        '
    - id: chemistry
      label: Chemistry
      filename: quickstart.py
      source: "import pandas as pd\nfrom graphfla import analysis\nfrom graphfla.landscape import Landscape\n\n\
        df = pd.read_csv(\"reactions.csv\")\nX = df[[\"catalyst\", \"solvent\"]]  # Reaction conditions\nf = df[\"\
        yield\"]  # Product yield, to maximize\n\nlandscape = Landscape(maximize=True)\nlandscape.build_from_data(\n\
        \    X, f, data_types={c: \"categorical\" for c in X}\n)\nanalysis.profile(landscape, seed=42)\n"
    - id: materials
      label: Materials
      filename: quickstart.py
      source: 'import pandas as pd

        from graphfla import analysis

        from graphfla.landscape import OrdinalLandscape


        df = pd.read_csv("alloys.csv")

        X = df[["W", "Re"]]  # W and Re content; Os makes up the rest

        f = df["hardness"]  # Hardness at 1,000 °C, to maximize


        landscape = OrdinalLandscape(maximize=True)

        landscape.build_from_data(X, f)

        analysis.profile(landscape, seed=42)

        '
    - id: software
      label: Software
      filename: quickstart.py
      source: "import pandas as pd\nfrom graphfla import analysis\nfrom graphfla.landscape import BooleanLandscape\n\
        \ndf = pd.read_csv(\"builds.csv\")\nflags = [\"gvn\", \"inline\", \"instcombine\",\n         \"jump_threading\"\
        , \"sccp\", \"simplifycfg\"]\nX = df[flags]  # One on/off column per compiler flag\nf = df[\"time\"]  #\
        \ Compilation time, to minimize\n\nlandscape = BooleanLandscape(maximize=False)\nlandscape.build_from_data(X,\
        \ f)\nanalysis.profile(landscape, seed=42)\n"
    - id: hpo
      label: Hyperparameters
      filename: quickstart.py
      source: "import pandas as pd\nfrom graphfla import analysis\nfrom graphfla.landscape import Landscape\n\n\
        df = pd.read_csv(\"grid_search.csv\")\nX = df[[\"depth\", \"leaf\", \"features\"]]  # Hyperparameters\n\
        f = df[\"rmse\"]  # Validation error, to minimize\n\nlandscape = Landscape(maximize=False)\nlandscape.build_from_data(\n\
        \    X, f, data_types={c: \"ordinal\" for c in X}\n)\nanalysis.profile(landscape, seed=42)\n"
  classes:
    title: Seven landscape classes
    text: Choose the class that matches your data.
    entries:
    - name: Landscape
      note: any mix of column types
      href: landscape/
    - name: SequenceLandscape
      note: shared alphabet
      href: sequence-landscape/
    - name: BooleanLandscape
      note: binary variables
      href: boolean-landscape/
    - name: OrdinalLandscape
      note: ordered levels
      href: ordinal-landscape/
    - name: DNALandscape
      note: A · C · G · T
      href: dna-landscape/
    - name: RNALandscape
      note: A · C · G · U
      href: rna-landscape/
    - name: ProteinLandscape
      note: 20 amino acids
      href: protein-landscape/
performance:
  eyebrow: Performance
  title: Scales to millions of candidates on a single machine.
  intro: Every stage of landscape construction has been optimized in detail. The comparison below measures construction
    time and peak memory against a naive implementation that compares all pairs of candidates.
  headline:
    speedup: faster construction at {configurations} candidates
    memory_saved: lower peak memory on the same build
  series:
    graphfla: GraphFLA
    naive: Naive all-pairs
  charts:
    time:
      title: Construction time
      unit: log scale
    memory:
      title: Peak memory
      unit: log scale
  x_title: candidates
  footnote: Complete binary landscapes with 8 to 20 variables. Apple M4 Pro, Python 3.9, single thread. Peak memory
    includes Python and its dependencies. The baseline is a nested Python loop with a dense distance matrix.
cases:
  eyebrow: Case studies
  title: Applicable to any combinatorial optimization problem.
  intro: GraphFLA makes no assumption about what the variables or the objective represent. The same analysis applies
    to amino acids and reaction conditions, alloy compositions and neural architectures, drug doses and compiler
    flags.
  stories:
    suzuki:
      title: Chemical reaction optimization
      subtitle: Suzuki–Miyaura coupling
      unit: reaction conditions
      description: Ligand, base and solvent for one pair of reactants, scored by the UV signal of the coupling product.
    flow-semihydrogenation:
      title: Reaction process optimization
      subtitle: Electrochemical flow hydrogenation
      unit: operating conditions
      description: Concentration, temperature and residence time in a flow reactor, scored by selectivity and current
        efficiency.
    alloy:
      title: Alloy composition optimization
      subtitle: Tungsten–rhenium–osmium alloys
      unit: alloy compositions
      description: Tungsten, rhenium and osmium fractions of an alloy, scored by hardness at 1,000 °C.
    perovskite:
      title: Materials design
      subtitle: Hybrid perovskites · ABX₃
      unit: crystal compositions
      description: Organic ion, metal and halide of a hybrid perovskite crystal, scored by its calculated electronic
        band gap.
    microbiome:
      title: Microbial growth optimization
      subtitle: BacPUS · Gut bacteria and polysaccharides
      unit: strain–substrate pairs
      description: Pairs of gut bacterial strains and polysaccharide nutrient sources, scored by growth after 48
        hours.
    cyanimide:
      title: Enzyme inhibitor discovery
      subtitle: Cyanimide library · Mouse USP18
      unit: building-block pairs
      description: Amine and carboxylic-acid building blocks combined into inhibitors, scored by inhibition of mouse
        USP18.
    drug-combination:
      title: Drug combination optimization
      subtitle: NCI-ALMANAC · Cancer cell assays
      unit: drug–dose combinations
      description: A partner drug for a fixed anticancer drug and the doses of both, scored by their effect on cancer-cell
        growth.
    neural-architecture:
      title: Neural architecture search
      subtitle: NAS-Bench-201 · CIFAR-10
      unit: network architectures
      description: The operation on each of six connections in a neural-network cell, scored by image-classification
        accuracy.
    software-configuration:
      title: Software configuration tuning
      subtitle: LLVM · Compiler flags
      unit: compiler configurations
      description: Ten LLVM compiler options switched on or off, scored by compilation time for a fixed workload.
