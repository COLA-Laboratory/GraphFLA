metrics:
  eyebrow: What you can measure
  title: Understand your problem from four complementary perspectives.
  intro: Build a comprehensive picture of your optimization problem with four groups of complementary metrics. Use
    them individually or summarize them in one profile.
  cards:
  - title: Ruggedness
    question: Local optima and variation in performance.
    text: Quantify local optima and how sharply performance changes between nearby designs. Distinguish smooth trends
      from irregular regions that complicate optimization.
    functions:
    - local_optima_ratio
    - r_s_ratio
    - autocorrelation
    - gradient_intensity
    link:
      label: Explore ruggedness
      href: ruggedness
    figure:
      name: ruggedness
      alt: 'Two landscapes side by side: a smooth one with a single peak and a rugged one with many local peaks.'
      labels:
        smooth: 'smooth: one peak'
        rugged: 'rugged: many local peaks'
  - title: Interactions
    question: The effect of one variable depends on others.
    text: Measure whether changing one variable has a consistent effect or depends on the surrounding choices, including
      interactions involving several variables.
    functions:
    - gamma
    - classify_epistasis
    - idiosyncratic_index
    - walsh_hadamard
    link:
      label: Explore interactions
      href: epistasis
    figure:
      name: epistasis
      alt: The same step across the landscape climbs toward a peak in one place and descends from a peak in another.
      legend:
      - swatch: line
        tone: accent
        label: a change that improves the outcome here
      - swatch: line
        tone: mark
        label: the same change worsens it there
  - title: Navigability
    question: Access to better outcomes through local changes.
    text: Measure how often improving steps can reach the best observed outcome, how long those paths are, and whether
      distance helps guide the search.
    functions:
    - global_optima_accessibility
    - mean_path_length_to_global_optimum
    - fdc
    link:
      label: Explore navigability
      href: navigability
    figure:
      name: navigability
      alt: 'Improving search paths on a three-peaked landscape: two reach the global peak, three stop on lower local
        peaks.'
      legend:
      - swatch: line
        tone: accent
        label: reaches the global peak
      - swatch: line
        tone: mark
        label: trapped on a local peak
  - title: Neutrality
    question: Regions where changes have little effect.
    text: Measure the share of neighboring choices whose objective values differ by less than a specified tolerance.
      Identify flat regions that can slow or redirect a search.
    functions:
    - neutrality
    - evolvability_enhancing_fraction
    link:
      label: Explore neutrality
      href: neutrality
    figure:
      name: neutrality
      alt: Variants on a flat plateau share the same objective value and form a neutral network; one further step
        leaves the plateau for a higher peak.
      legend:
      - swatch: dots
        tone: mark
        label: near-equal outcomes
      - swatch: line
        tone: accent
        label: a change that opens a better region
start:
  eyebrow: Quick start
  title: From a data table to analysis in a few lines.
  lede: Load your results, identify the variables and objective, and build a landscape. The same workflow applies
    to experimental measurements, simulation outputs and model evaluations.
  links:
  - label: Try a worked tutorial
    href: tutorials
    accent: true
  - label: Read the API reference
    href: api
  code:
    filename: quickstart.py
    language: Python
    source: "import pandas as pd\nfrom graphfla import analysis\nfrom graphfla.landscape import Landscape\n\ndf\
      \ = pd.read_csv(\"experiments.csv\")\nX = df[[\"catalyst\", \"solvent\"]]\nf = df[\"response\"]  # The outcome\
      \ to maximize\n\nlandscape = Landscape(maximize=True).build_from_data(\n    X, f, data_types={c: \"categorical\"\
      \ for c in X},\n    verbose=False,\n)\nanalysis.profile(landscape, seed=42)\n"
  classes:
    title: Seven landscape classes, one API
    text: Pick the class that matches your data.
    entries:
    - name: Landscape
      note: any mix of column types
    - name: SequenceLandscape
      note: shared alphabet
    - name: BooleanLandscape
      note: bit-strings
    - name: OrdinalLandscape
      note: ordered levels
    - name: DNALandscape
      note: A · C · G · T
    - name: RNALandscape
      note: A · C · G · U
    - name: ProteinLandscape
      note: 20 amino acids
performance:
  eyebrow: Performance
  title: Scale to larger datasets with efficient construction.
  intro: Spend less time building the graph and more time studying your problem. The comparison below measures construction
    time and total process memory against a naive all-pairs implementation.
  headline:
    speedup: faster construction at {configurations} configurations
    memory_saved: less peak memory on the same build
  series:
    graphfla: GraphFLA
    naive: Naive all-pairs
  charts:
    time:
      title: Construction time
      unit: log scale
    memory:
      title: Peak memory
      unit: MiB
  x_title: configurations
  footnote: Complete binary landscapes with 8, 10 and 12 variables. Apple M4 Pro, Python 3.9, single thread; median
    of three fresh processes. Peak memory includes Python and its dependencies. The baseline is a nested Python
    loop with a dense distance matrix.
  link:
    label: Benchmark setup and all results
    href: benchmarks
cases:
  eyebrow: Case studies
  title: One framework for optimization across domains.
  intro: Apply the same graph-based analysis to experiments, simulations and software systems. These worked examples
    show how different variables and objectives fit a common workflow.
  stories:
    suzuki:
      title: Chemical reaction optimization
      subtitle: Suzuki–Miyaura coupling
      unit: reaction conditions
      description: Vary ligand, base and solvent choices for a fixed pair of reactants. Compare how alternative
        reaction conditions affect the amount of target product detected by UV.
    flow-semihydrogenation:
      title: Reaction process optimization
      subtitle: Electrochemical flow hydrogenation
      unit: operating conditions
      description: Vary concentration, temperature and time in the reactor. Evaluate how these settings jointly
        affect selectivity for the desired product and the efficiency of electrical current use.
    alloy:
      title: Alloy composition optimization
      subtitle: Tungsten–rhenium–osmium alloys
      unit: alloy compositions
      description: Vary tungsten, rhenium and osmium proportions to optimize hardness at 1,000 °C. Examine how exchanging
        small amounts of one metal for another changes the result.
    perovskite:
      title: Materials design
      subtitle: Hybrid perovskites · ABX₃
      unit: crystal compositions
      description: Choose the organic ion, metal and halide that make up a crystal. Compare these component choices
        to identify compositions with a lower calculated electronic band gap.
    microbiome:
      title: Microbial growth optimization
      subtitle: BacPUS · Gut bacteria and polysaccharides
      unit: strain–substrate pairs
      description: Select a bacterial strain and a polysaccharide nutrient source. Compare their combinations to
        identify conditions that support greater growth after 48 hours.
    cyanimide:
      title: Enzyme inhibitor discovery
      subtitle: Cyanimide library · Mouse USP18
      unit: building-block pairs
      description: Combine amine and carboxylic-acid building blocks to generate candidate inhibitors. Compare the
        resulting reaction mixtures for inhibition of the mouse USP18 enzyme.
    drug-combination:
      title: Drug combination optimization
      subtitle: NCI-ALMANAC · Cancer cell assays
      unit: drug–dose combinations
      description: Choose a partner for a fixed anticancer drug and vary both doses. Compare combinations by their
        effect on cancer-cell growth in a laboratory assay.
    neural-architecture:
      title: Neural architecture search
      subtitle: NAS-Bench-201 · CIFAR-10
      unit: network architectures
      description: Choose an operation for each of six connections in a neural-network cell. Compare image-classification
        accuracy across architectures trained under the same conditions.
    software-configuration:
      title: Software configuration tuning
      subtitle: LLVM · Compiler flags
      unit: compiler configurations
      description: Enable or disable ten compiler options in different combinations. Compare compilation times for
        a fixed workload to understand which settings and interactions improve performance.
