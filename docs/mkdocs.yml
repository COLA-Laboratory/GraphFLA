site_name: GraphFLA
site_description: Graph-based fitness landscape analysis
site_url: https://graphfla.org/
repo_url: https://github.com/COLA-Laboratory/GraphFLA
repo_name: COLA-Laboratory/GraphFLA
docs_dir: content
site_dir: .build/site
dev_addr: 127.0.0.1:8818
watch: [../graphfla, _support, templates, includes, home, overrides]
theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  language: en
  palette: {scheme: default, primary: black, accent: purple}
  features: [navigation.top, navigation.tabs, navigation.tabs.sticky, search.suggest, search.highlight, content.code.copy, toc.follow]
nav:
  - Home: index.md
  - Datasets: datasets.md
  - Example methods: demo-methods.md
  - Interactive benchmark data: insights-sources.md
  - API reference:
      - Landscapes:
          - Landscape: landscape.md
          - BooleanLandscape: boolean-landscape.md
          - OrdinalLandscape: ordinal-landscape.md
          - SequenceLandscape: sequence-landscape.md
          - DNALandscape: dna-landscape.md
          - RNALandscape: rna-landscape.md
          - ProteinLandscape: protein-landscape.md
      - Problems:
          - Biological Models: problems.md
          - Combinatorial Problems: problems/combinatorial.md
      - Analysis:
          - Landscape profile: analysis/profile.md
          - Epistasis: analysis/epistasis.md
          - Navigability: analysis/navigability.md
          - Robustness: analysis/robustness.md
          - Ruggedness: analysis/ruggedness.md
          - Fitness distributions: analysis/fitness.md
  - Benchmarks: benchmarks.md
# Earlier template samples remain on disk; this integration covers these three modules.
exclude_docs: |
  nk.md
  optimization-problem.md
  hill-climb.md
  draw-fitness-distance-corr.md
  landscape-filter.md
  sobol-sampling.md
  get-lon.md
plugins:
  - search
  - mkdocstrings:
      custom_templates: templates
      handlers:
        python:
          paths: [..]
          options:
            allow_inspection: false
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
              trim_doctest_flags: false
            docstring_section_style: list
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: false
            show_source: false
            inherited_members: true
            members_order: source
            filters: ['!^_']
            merge_init_into_class: true
            show_if_no_docstring: false
            heading_level: 3
hooks: [_support/hooks.py, _support/landing.py, _support/seo.py]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc: {permalink: true, toc_depth: 3}
  - pymdownx.highlight: {use_pygments: true}
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets: {check_paths: true}
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.arithmatex: {generic: true}
extra_css:
  - assets/home/css/tokens.css
  - assets/home/css/base.css
  - assets/home/css/components.css
  - assets/home/css/sections.css
  - assets/home/css/insights.css
  - assets/site.css
  - assets/api.css
  - assets/tutorials.css
extra_javascript:
  - assets/home/home.js
  - assets/api.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra:
  generator: false
  # Link-preview image, relative to the site root.
  social_card: assets/social-card.png
  # Public key for IndexNow submissions (docs/scripts/indexnow.py); served as <key>.txt.
  indexnow_key: e66860255844005fd4037deecdce4af3
  tutorial_catalog: tutorials.yml
  api_modules: [graphfla.landscape, graphfla.analysis, graphfla.problems]
  api_omissions:
    graphfla.analysis.list_metrics: The metric registry listing is intentionally outside the website scope.
  # One shared icon map. Unlisted API links inherit their source object's kind.
  navigation_icons:
    defaults:
      section: material/layers-triple-outline
      page: material/format-list-bulleted
      overview: material/view-dashboard-outline
      class: material/cube-outline
      function: material/function-variant
    sections:
      API reference: material/book-open-variant
      Tutorials: material/book-open-page-variant-outline
      Landscapes: material/layers-triple-outline
      Problems: material/flask-outline
      Analysis: material/chart-line
    pages:
      index.md: material/home-outline
      landscape.md: material/cube-outline
      boolean-landscape.md: material/numeric-10-box-outline
      ordinal-landscape.md: material/sort-numeric-ascending
      sequence-landscape.md: material/format-letter-matches
      dna-landscape.md: material/dna
      rna-landscape.md: material/sine-wave
      protein-landscape.md: material/molecule
      problems.md: material/dna
      problems/combinatorial.md: material/shape-outline
      analysis/profile.md: material/clipboard-list-outline
      analysis/epistasis.md: material/vector-polyline
      analysis/navigability.md: material/routes
      analysis/robustness.md: material/shield-check-outline
      analysis/ruggedness.md: material/image-filter-hdr
      analysis/fitness.md: material/chart-bell-curve
      benchmarks.md: material/speedometer
      datasets.md: material/database-outline
      demo-methods.md: material/flask-outline
